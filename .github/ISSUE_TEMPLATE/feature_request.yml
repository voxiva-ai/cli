name: Feature idea
description: Suggest a focused improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the workflow that is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Voxiva to do?
      description: A short example of the ideal workflow is helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention any current workaround.
