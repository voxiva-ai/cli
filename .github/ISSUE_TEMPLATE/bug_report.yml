name: Bug report
description: Report a problem with Voxiva CLI
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please remove API keys, private prompts, and other sensitive information
        before submitting. Never attach `~/.voxiva/auth.json`.
  - type: input
    id: version
    attributes:
      label: Voxiva version
      description: Run `voxiva --version`.
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what did you expect to happen?
      placeholder: Include the exact command and steps, but no secrets.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include a redacted error message or screenshot if useful.
    validations:
      required: true
