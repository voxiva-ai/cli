<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxiva</title>
    <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <aside class="sidebar">
      <div class="brand"><img src="./assets/voxiva-cli-mark.png" alt="" /><span>voxiva</span></div>
      <button class="nav-item active" id="nav-chat"><span class="nav-glyph">✳</span><span>New chat</span><kbd>Ctrl N</kbd></button>
      <button class="nav-item" id="nav-terminal"><span class="nav-glyph terminal-glyph">&gt;_</span><span>Terminal</span><kbd>Ctrl J</kbd></button>
      <div class="side-section"><span>PROJECT</span><button class="icon-button" id="open-project" title="Open project" aria-label="Open project">+</button></div>
      <button class="workspace" id="workspace-button"><span class="workspace-copy"><b id="workspace-name">Choose a project</b><small id="workspace-path">Open a folder to begin</small></span><span class="chevron">⌄</span></button>
      <div class="sidebar-bottom"><button class="profile" id="settings-button"><span><b>voxiva</b><small id="model-caption">Loading model…</small></span><span class="chevron">···</span></button></div>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <div class="top-leading"><button class="icon-button sidebar-toggle" id="sidebar-toggle" title="Show sidebar" aria-label="Show sidebar">☰</button><div class="breadcrumbs"><span class="crumb-muted" id="top-project">No project</span><span class="slash">/</span><span id="view-title">New chat</span></div></div>
        <div class="top-actions"><button class="top-chip" id="plan-chip" title="Choose agent plan"><span id="plan-chip-label">Build</span><span>⌄</span><select id="plan-select" aria-label="Agent plan"></select></button><button class="icon-button" id="theme-button" title="Switch appearance">◐</button><button class="icon-button" id="top-terminal" title="Open terminal">&gt;_</button></div>
      </header>

      <section class="chat-view" id="chat-view">
        <div class="chat-scroll" id="chat-scroll">
          <div class="welcome" id="welcome">
            <div class="hero-brand"><img src="./assets/voxiva-cli-mark.png" alt="" /><span>voxiva</span></div>
          </div>
          <div class="messages" id="messages" aria-live="polite"></div>
        </div>
        <div class="composer-area">
          <form class="composer" id="composer-form">
            <textarea id="prompt" rows="1" placeholder="Спросите что угодно, / — команды, @ — контекст…" aria-label="Message Voxiva"></textarea>
            <div class="composer-bottom">
              <div class="composer-tools"><button class="tool-button" id="attach-file" type="button" title="Добавить файл из проекта" aria-label="Добавить файл из проекта">+</button><select id="model-select" aria-label="Model" title="Model"><option value="voxiva/big-pickle">Big Pickle</option></select></div>
              <div class="send-tools"><button class="send-button" id="send-button" type="submit" disabled title="Send message">↑</button><button class="send-button stop-button" id="stop-button" type="button" hidden title="Stop response">■</button></div>
            </div>
          </form>
          <div class="workspace-context"><button type="button" class="project-chip" id="composer-project" title="Выбрать проект"><svg class="context-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4l1.5 1.7H14v6.3H2z" /></svg><span class="context-label" id="context-label">Выберите проект</span><span class="chip-chevron">⌄</span></button><span class="context-divider">/</span><span class="local-chip"><svg class="context-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1.2"/><path d="M6 13.5h4M8 11v2.5"/></svg>Локально</span><span class="branch-chip" id="branch-chip" hidden><svg class="context-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 13V3m0 3h5a3 3 0 0 1 3 3v1m0 0-2-2m2 2 2-2"/></svg><span id="branch-name"></span></span></div>
          <div class="composer-note">Voxiva can make mistakes. Review proposed file changes before applying.</div>
        </div>
        <div class="home-footnote">Работа ведётся локально в выбранной папке проекта.</div>
      </section>

      <section class="terminal-view" id="terminal-view" hidden>
        <div class="terminal-toolbar"><div><span class="live-dot" id="terminal-dot"></span><b>Voxiva CLI</b><span class="terminal-project" id="terminal-project">Choose a project</span></div><button class="button subtle" id="terminal-open-project">Open folder</button><button class="button subtle" id="terminal-new">Restart terminal</button></div>
        <div id="terminal"></div>
      </section>
      <footer class="statusbar"><span id="status-text">Ready</span><span id="status-meta">Build · Voxiva</span></footer>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
